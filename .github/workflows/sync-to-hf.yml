name: Sync to HuggingFace Space

on:
  push:
    branches:
      - main
      - claude/zealous-carson-oMr43

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── Pre-flight validation ───────────────────────────────────────────────────
  validate:
    name: Validate before deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -q -r api/requirements.txt

      - name: Import check (catches syntax + missing deps)
        run: |
          DATA_DIR=/tmp/ci-data python -c "
          import sys, os
          sys.path.insert(0, '.')
          os.environ.setdefault('DATA_DIR', '/tmp/ci-data')
          from api.utils.settings import get_settings
          from api.utils.metrics import get_recent_runs
          from api.utils.logger import info
          from api.utils.budget import get_daily_spend
          from api.utils.circuit_breaker import all_statuses
          from api.utils.telemetry import golden_signals
          from api.feeds.sovrn import get_sovrn_product
          from api.ai.text import generate_post_text
          print('All imports OK')
          "

      - name: Run Python unit tests
        run: |
          DATA_DIR=/tmp/ci-data python -m pytest api/tests/ -v --tb=short \
            --html=test-report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: test-report.html

      - name: Dockerfile syntax check
        run: docker build --check . || true
        # 'check' mode available in Docker 24+; non-fatal if unavailable

  # ── Deploy to HuggingFace Space ─────────────────────────────────────────────
  deploy:
    name: Deploy to HuggingFace
    needs: validate
    runs-on: ubuntu-latest

    permissions:
      id-token: write   # required to request the OIDC token
      contents: read

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve HuggingFace token
        env:
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
          HF_TOKEN_SECRET: ${{ secrets.HF_TOKEN }}
        run: |
          set -euo pipefail

          # Prefer a static HF_TOKEN secret if present.
          # Fall back to Trusted Publisher OIDC exchange (requires Space Settings → Trusted Publishers).
          if [ -n "${HF_TOKEN_SECRET:-}" ]; then
            echo "Using HF_TOKEN secret"
            echo "::add-mask::${HF_TOKEN_SECRET}"
            DELIM="EOF_$(openssl rand -hex 16)"
            { echo "HF_TOKEN<<$DELIM"; echo "${HF_TOKEN_SECRET}"; echo "$DELIM"; } >> "$GITHUB_ENV"
            exit 0
          fi

          echo "HF_TOKEN secret not set — attempting Trusted Publisher OIDC exchange"
          ID_TOKEN=$(curl -sSf \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://huggingface.co" \
            | jq -r .value)

          HEADERS=$(mktemp); BODY=$(mktemp)
          STATUS=$(curl -sS -D "$HEADERS" -o "$BODY" -w '%{http_code}' \
            -X POST "https://huggingface.co/oauth/token" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
                  --arg t "$ID_TOKEN" \
                  --arg r "spaces/${HF_USERNAME}/${HF_SPACE_NAME}" \
                  '{
                    grant_type:         "urn:ietf:params:oauth:grant-type:token-exchange",
                    subject_token_type: "urn:ietf:params:oauth:token-type:id_token",
                    subject_token:      $t,
                    resource:           $r
                  }')")

          if [ "$STATUS" -ne 200 ]; then
            REQUEST_ID=$(grep -i '^x-request-id:' "$HEADERS" | sed 's/.*: *//' | tr -d '\r')
            echo "::error::HF token exchange failed HTTP $STATUS (x-request-id: ${REQUEST_ID:-unknown})"
            echo "::error::To fix: add HF_TOKEN as a GitHub secret, OR configure Trusted Publishers on the HF Space."
            cat "$BODY"
            exit 1
          fi

          HF_TOKEN=$(jq -r .access_token "$BODY")
          echo "::add-mask::$HF_TOKEN"
          DELIM="EOF_$(openssl rand -hex 16)"
          { echo "HF_TOKEN<<$DELIM"; echo "$HF_TOKEN"; echo "$DELIM"; } >> "$GITHUB_ENV"

      - name: Push to HuggingFace Space
        env:
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name  "github-actions[bot]"
          git remote add space \
            https://${HF_USERNAME}:${HF_TOKEN}@huggingface.co/spaces/${HF_USERNAME}/${HF_SPACE_NAME}
          git push space HEAD:main --force

      - name: Health gate — verify Space is up after deploy
        env:
          HF_USERNAME:   ${{ secrets.HF_USERNAME }}
          HF_SPACE_NAME: ${{ secrets.HF_SPACE_NAME }}
        run: |
          URL="https://${HF_USERNAME}-${HF_SPACE_NAME}.hf.space/health"
          echo "Checking $URL"
          # HF Spaces can take 2-5 min to rebuild Docker containers
          for i in $(seq 1 15); do
            BODY=$(curl -s -w "\nHTTP_STATUS:%{http_code}" "$URL" || echo "HTTP_STATUS:000")
            STATUS=$(echo "$BODY" | grep "HTTP_STATUS:" | cut -d: -f2)
            echo "Attempt $i: HTTP $STATUS"
            if [ "$STATUS" = "200" ]; then
              echo "Health gate PASSED"
              exit 0
            fi
            if [ "$i" = "1" ]; then
              echo "Response body: $(echo "$BODY" | grep -v HTTP_STATUS | head -5)"
            fi
            sleep 20
          done
          echo "::warning::Health gate could not verify Space health after 5 minutes — check HF Space logs"
          exit 0
